[package]
name = "stroke-desktop"
version = "0.1.0"
description = "Stroke Cyberpunk Studio & AI Copilot with Private Background Terminal"
authors = ["Ayansh Shrivastava"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.6", features = ["v4"] }
regex = "1.10"
lazy_static = "1.4"
chrono = "0.4"
