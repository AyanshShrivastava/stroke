name: Build Stroke Desktop Client

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pywebview

      - name: Compile macOS Application Bundle
        run: |
          python build_desktop.py

      - name: Create DMG / Archive
        run: |
          cd dist
          zip -r Stroke-macOS-Universal.zip Stroke.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stroke-macOS
          path: dist/Stroke-macOS-Universal.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pywebview

      - name: Compile Windows Executable
        run: |
          python build_desktop.py

      - name: Create ZIP Archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Stroke -DestinationPath dist/Stroke-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stroke-Windows
          path: dist/Stroke-Windows-x64.zip
