name: Build Stroke Desktop Client

on:
  push:
    branches: [main, product-v1-overhaul]
    tags: ["v*"]
  pull_request:
    branches: [main, product-v1-overhaul]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller pywebview

      - name: Run Backend Test Suite
        env:
          STROKE_DEV_CONSOLE_OTP: "1"
          STROKE_ALLOW_OFFLINE_DB: "1"
        run: |
          pytest -q

      - name: Compile macOS Application Bundle
        run: |
          python build_desktop.py

      - name: Create DMG / Archive
        run: |
          cd dist
          zip -r Stroke-macOS-Universal.zip Stroke.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stroke-macOS
          path: dist/Stroke-macOS-Universal.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller pywebview

      - name: Run Backend Test Suite
        env:
          STROKE_DEV_CONSOLE_OTP: "1"
          STROKE_ALLOW_OFFLINE_DB: "1"
        run: |
          pytest -q

      - name: Compile Windows Executable
        run: |
          python build_desktop.py

      - name: Create ZIP Archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Stroke -DestinationPath dist/Stroke-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stroke-Windows
          path: dist/Stroke-Windows-x64.zip
